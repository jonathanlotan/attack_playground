services:
  containerssh:
    # pinned: "latest" moved between releases and a schema change there would
    # silently break the networkmode mapping in config.yaml (unknown keys are
    # ignored, not rejected). bump on purpose, then run ./verify.sh.
    image: containerssh/containerssh:v0.5.2
    container_name: containerssh
    # deliberately NOT restarted by docker. the iptables restrictions are applied
    # by start.sh and do not survive a reboot, so a containerssh that came back
    # on its own after one would accept logins onto an unrestricted network.
    # the systemd unit in systemd/ brings the playground back through start.sh
    # instead, restrictions first.
    restart: "no"
    user: root
    ports:
      # the host side is SSH_PORT from .env - the one place the published ports
      # are set; ":?" makes a missing value a loud failure rather than a silently
      # different port. the container side is where containerssh listens.
      - "${SSH_PORT:?set SSH_PORT in .env}:2222"
    volumes:
      # config.runtime.yaml, not config.yaml: the guests' /etc/hosts entry for
      # researchlabs.tech points at the gateway of attack_playground_net, and docker
      # only numbers that network when it creates it. start.sh renders the tracked
      # config.yaml into this file once the network exists - see
      # scripts/render_config.py. bring the playground up with ./start.sh, not with
      # "docker compose up": without the rendered file docker mounts an empty
      # directory here and containerssh comes up with no config at all.
      - ./config.runtime.yaml:/etc/containerssh/config.yaml:ro
      - ./host.key:/etc/containerssh/host.key:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - containerssh_net
    # containerssh starts accepting ssh the moment it is up, but it cannot
    # authenticate anyone until the webhook answers. without this gate every login
    # during that window fails with
    #   HTTP POST .../auth/password failed (dial tcp ...:8080: connect: connection refused)
    # and the playground looks broken to whoever connects first.
    depends_on:
      containerssh-auth:
        condition: service_healthy
    # log.level is "debug" and every connection from the lan is logged. the
    # json-file driver is unbounded by default.
    logging: &logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  containerssh-auth:
    image: python:3.11-slim
    # see containerssh above - on its own this service is harmless, but it is
    # only ever useful next to containerssh, so it follows the same lifecycle.
    restart: "no"
    # no pip install: auth_server.py is stdlib only, so this container needs no
    # network when it starts and is serving within a second of being created.
    # -u so its request log is not stuck in a buffer when you go looking for it.
    command: ["python", "-u", "/app/auth_server.py"]
    volumes:
      - ./auth_server.py:/app/auth_server.py:ro
    # ready means "the webhook is actually listening", not "the container exists".
    # stdlib only - python:3.11-slim has no curl or nc.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('127.0.0.1', 8080), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    ports:
      # bound to loopback on purpose. this webhook authenticates *anybody* as any
      # username they ask for, and on a linux host a published port is DNATed in the
      # nat table before ufw/firewalld ever sees it - "0.0.0.0:${AUTH_PORT}" would hand the
      # whole lan a way to mint sessions. containerssh reaches it by service name on
      # containerssh_net and does not need the published port at all; it is kept
      # only so the operator can curl it while debugging. the port is AUTH_PORT
      # from .env.
      - "127.0.0.1:${AUTH_PORT:?set AUTH_PORT in .env}:8080"
    networks:
      - containerssh_net
    logging: *logging

  playground-stats:
    image: python:3.11-slim
    # follows the playground lifecycle like the other services: brought up by
    # start.sh, taken down by stop.sh, never restarted by docker on its own.
    restart: "no"
    # stdlib only, nothing to install - see stats_server.py for what is counted
    # and for the api. -u so the session log is not stuck in a buffer.
    command: ["python", "-u", "/app/stats_server.py"]
    environment:
      # the image guests are created from (docker.execution.container.image in
      # config.yaml): a container from any other image is not a user
      GUEST_IMAGE: "attack_playground_image:latest"
      # the "connected in the last ..." window when a request does not name one
      # with ?window=: seconds, or a count with s, m, h or d
      STATS_WINDOW: "1h"
    volumes:
      - ./stats_server.py:/app/stats_server.py:ro
      # a session is a guest container starting and dying, read off the docker
      # event stream. this socket is root on the host: the stats server only ever
      # sends GET requests over it, but ":ro" does not enforce that - it makes the
      # socket file unwritable, not the api behind it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # the sqlite file the sessions live in, so "ever connected" survives
      # restarts of the playground. created root-owned on first start; cleanup.sh
      # leaves it alone, and "rm -rf stats_data" starts the count over.
      - ./stats_data:/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('127.0.0.1', 8081), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    ports:
      # loopback only, like the auth webhook: nothing needs this from the lan, and
      # a published port is DNATed before the host firewall sees it. the port is
      # STATS_PORT from .env (2224 as shipped); read it with
      #   curl http://127.0.0.1:$STATS_PORT/stats
      # or tunnel it from elsewhere: ssh -L $STATS_PORT:127.0.0.1:$STATS_PORT <host>
      - "127.0.0.1:${STATS_PORT:?set STATS_PORT in .env}:8081"
    networks:
      - containerssh_net
    logging: *logging

networks:
  containerssh_net:
    driver: bridge
